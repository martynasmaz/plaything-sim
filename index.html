<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title></title><link rel="icon" href="data:,">
</head>
<body>
<div class="app">
<header><div><p class="eyebrow" data-copy="ui.eyebrow"></p><h1><span data-copy="ui.title"></span></h1></div><div class="header-note" data-copy="ui.headerNote"></div></header>
<div class="notice" id="no-save"><strong data-copy="ui.noSaveTitle"></strong> <span class="notice-main" data-copy="ui.noSave"></span> <span data-copy="ui.watch"></span></div>
<section class="topline" data-copy-aria="ui.villageStatus"><div class="day-box"><small id="age-label"></small><strong id="day"></strong><span id="status"></span></div><div class="stats" id="stats"></div><div class="playback"><div class="segmented" data-copy-aria="ui.playback"><button id="pause" data-speed="0" data-copy="ui.pause"></button><button id="normal" data-speed="1" data-copy="ui.normal"></button><button id="fast" data-speed="3" data-copy="ui.fast"></button></div><div><button id="next-day" class="subtle" data-copy="ui.nextDay"></button><button id="restart" class="subtle danger" data-copy="ui.restart"></button></div></div></section>
<main>
<section class="world-column">
<div class="world-panel"><div class="panel-heading"><h2 data-copy="ui.world"></h2><span class="weather-line"><span id="weather-summary"></span><span id="forecast" class="forecast"></span></span></div><div id="village" role="img" data-copy-aria="ui.villageAria"></div><div class="world-caption"><span id="fire-summary"></span><span id="day-progress"></span></div><div class="progress-track"><div id="progress"></div></div></div>
<div id="milestone" class="milestone" hidden></div>
<div id="ended" class="end-panel" hidden role="dialog" aria-labelledby="end-title"><h2 id="end-title" data-copy="ui.endTitle"></h2><p id="end-body"></p><dl id="end-stats" class="end-stats"></dl><button id="restart-ended" data-copy="ui.restartVillage"></button><small id="end-seed" class="end-seed"></small></div>
<section class="command-panel"><div class="panel-heading"><h2 data-copy="ui.commandTitle"></h2><span data-copy="ui.oneCommand"></span></div><div id="command-list" class="command-list"></div><div id="command-help" class="command-help"></div><form id="command-form" autocomplete="off"><label class="sr-only" for="command-input" data-copy="ui.commandInput"></label><span class="prompt" data-copy="ui.prompt"></span><input id="command-input" data-copy-placeholder="ui.placeholder" maxlength="100" spellcheck="false"><button type="submit" id="queue" data-copy="ui.queue"></button></form><div class="queue-row"><span id="queued"></span><button id="cancel" class="subtle" disabled data-copy="ui.cancel"></button></div><p id="feedback" class="feedback" role="status" aria-live="polite" data-copy="ui.feedback"></p></section>
</section>
<aside><section class="details-panel"><div class="panel-heading"><h2 data-copy="ui.lives"></h2><span id="population-label"></span></div><div id="roster" class="roster"></div><div id="villager-detail" aria-live="polite"></div></section><section class="log-panel"><div class="panel-heading"><h2 data-copy="ui.journal"></h2><span id="latest-label"></span></div><ol id="log" aria-live="polite"></ol></section></aside>
</main>
<footer><span id="goal"></span><span data-copy="ui.footer"></span></footer>
</div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><title>River fishing equipment preview</title>
<style>body{margin:20px;background:#e8ddc2;color:#382d24;font-family:Georgia,serif}h1{font-size:25px}p{max-width:1000px}canvas{max-width:100%;border:1px solid #a28c63}button{font:inherit;padding:6px 14px}</style>
<h1>River fishing — local visual check</h1><p>Stone Age materials: wooden spears, wicker traps, bone hooks, fixed-line poles, and plant-fibre nets with bark floats and stone sinkers. The equipment and people use the game's actual drawing functions.</p>
<button id="toggle">Pause animation</button> <span id="status">Live animation</span><br><br><canvas id="sheet" width="1200" height="660"></canvas>
<script>
// Canvas-native equipment: bark floats, stone sinkers and plant-fibre mesh.
// Coordinates place the fisher on the bank, with the gear below in the water.
function fishingStroke(g,x,y,ex,ey,color='#cbb98b',width=1.3){
  g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.strokeStyle=color;g.lineWidth=width;g.stroke();
}
function fishingOval(g,x,y,rx,ry,color){
  g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=color;g.fill();
}
function drawRiverFish(g,x,y,scale=1){
  g.save();g.translate(x,y);g.scale(scale,scale);
  fishingOval(g,0,0,7,2.6,'#b6c8b3');
  g.beginPath();g.moveTo(-6,0);g.lineTo(-11,-4);g.lineTo(-11,4);g.closePath();g.fillStyle='#809b91';g.fill();
  fishingStroke(g,-2,-1,4,-1,'#e7dec0',.9);fishingOval(g,4,-.4,.8,.8,'#303d36');g.restore();
}
function drawFishingMesh(g,x,y,width=62,height=30,lift=0,clock=0){
  const sway=Math.sin(clock*2)*1.4;
  g.save();g.translate(x,y);
  g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(width/2,4+sway,width,0);
  g.lineTo(width-5,height-lift);g.quadraticCurveTo(width/2,height+7-lift,5,height-lift);g.closePath();
  g.fillStyle='#d3c69b25';g.fill();
  for(let i=0;i<=8;i++){
    const u=i/8,top=width*u,bottom=5+(width-10)*u;
    fishingStroke(g,top,0,bottom,height-lift,'#d1c39a99',.8);
    if(i<8)fishingStroke(g,top,0,Math.min(width-5,bottom+10),height-lift,'#d1c39a99',.8);
  }
  for(let j=0;j<=4;j++){
    const t=j/4;fishingStroke(g,5*t,(height-lift)*t,width-5*t,(height-lift)*t,'#e0d0a89c',.8);
  }
  for(let i=0;i<=6;i++)fishingOval(g,width*i/6,Math.sin(i)*1.2,3.5,1.7,'#b78752');
  for(let i=0;i<=4;i++)fishingOval(g,5+(width-10)*i/4,height-lift,2.8,2,'#747b70');
  g.restore();
}
function drawWickerFishingTrap(g,x,y,lift=0){
  g.save();g.translate(x,y-lift);g.rotate(.18);
  g.beginPath();g.ellipse(16,0,20,8,0,0,Math.PI*2);g.fillStyle='#997445';g.fill();
  for(let i=0;i<=6;i++){
    const q=-1+i*5;g.beginPath();g.ellipse(q,0,4,7,0,-Math.PI/2,Math.PI/2);g.strokeStyle='#d0b580';g.lineWidth=1;g.stroke();
  }
  for(const y0 of [-5,-2,2,5])fishingStroke(g,-2,y0,33,y0,'#695037',.8);
  fishingOval(g,-2,0,5,7,'#554b34');fishingOval(g,1,0,2.8,4.5,'#b18e59');
  fishingOval(g,3,0,1.4,2.5,'#3f4536');g.restore();
}
function drawCarriedFishingGear(g,x,y,method){
  if(method==='spear'||method==='pole'){
    fishingStroke(g,x+8,y-13,x+15,y-48,'#b99768',2.3);
    if(method==='spear')fishingStroke(g,x+15,y-48,x+16,y-54,'#e2d6ad',1.4);
    else fishingStroke(g,x+15,y-48,x+10,y-18,'#ddcda5',.8);
  }else{
    for(let i=0;i<3;i++){
      g.beginPath();g.ellipse(x+8+i,y-17,3,4,0,0,Math.PI*2);
      g.strokeStyle='#c7b38a';g.lineWidth=1;g.stroke();
    }
  }
}
function drawRiverFishing(g,{x,y,method='trap',clock=0,id=0,caught=1}){
  const cycle=(clock*.12+id*.17)%1,haul=cycle>.52?Math.sin((cycle-.52)/.48*Math.PI):0;
  // Hands visibly reach toward the working gear instead of the walking pose.
  const handX=x+10,handY=y-14+haul*5;
  fishingStroke(g,x+4,y-23,handX,handY,'#382d24',2.4);
  if(method==='net'){
    fishingStroke(g,x-15,y+3,x-15,y+18,'#765c39',2.8);
    fishingStroke(g,x+62,y+5,x+62,y+22,'#765c39',2.8);
    fishingStroke(g,x-15,y+9,x-7,y+19,'#d6c69a',1.5);
    fishingStroke(g,handX,handY,x+8,y+19-haul*10,'#dfcda1',1.6);
    drawFishingMesh(g,x-7,y+19-haul*10,65,30,haul*15,clock);
    if(caught&&haul>.3)drawRiverFish(g,x+24,y+35-haul*22,.8);
  }else if(method==='trap'){
    fishingStroke(g,x-12,y-2,x-12,y+12,'#775839',3);
    fishingStroke(g,x-12,y+4,x+20,y+25-haul*19,'#d9c18e',1.3);
    fishingStroke(g,handX,handY,x+8,y+21-haul*19,'#d9c18e',1.6);
    drawWickerFishingTrap(g,x+8,y+24,haul*19);
    if(caught&&haul>.6)drawRiverFish(g,x+8,y+12-haul*12,.65);
  }else if(method==='spear'){
    const strike=Math.pow(Math.max(0,Math.sin(clock*2+id)),9);
    const tipX=x+26,tipY=y+18+strike*14;
    fishingStroke(g,x+4,y-35+strike*12,tipX,tipY,'#bc9867',2.7);
    for(const q of [-1,1])fishingStroke(g,tipX-3,tipY-7,tipX+q*2,tipY+1,'#ddd1a5',1.2);
    if(caught&&strike>.6)drawRiverFish(g,tipX,tipY-2,.7);
  }else{
    const tipX=method==='pole'?x+40:x+10,tipY=method==='pole'?y-32+haul*9:handY;
    if(method==='pole'){
      g.beginPath();g.moveTo(handX,handY);g.quadraticCurveTo(x+29,y-46,tipX,tipY);
      g.strokeStyle='#c5a271';g.lineWidth=2.3;g.stroke();
    }else{
      fishingOval(g,x+4,y-17,3.3,2,'#ae8b5e');
      fishingStroke(g,x-4,y-23,x+4,y-17,'#382d24',2.2);
    }
    const endX=x+40,endY=y+28-haul*32;
    fishingStroke(g,tipX,tipY,endX,endY,'#e7d8b0',.95);
    fishingOval(g,endX,endY-1,2,3,'#b79761');
    g.beginPath();g.moveTo(endX,endY+2);g.lineTo(endX,endY+6);g.quadraticCurveTo(endX+4,endY+9,endX+4,endY+4);
    g.strokeStyle='#e4d8b7';g.lineWidth=1;g.stroke();
    if(haul<.65)fishingOval(g,endX+3,endY+6,1.7,1,'#a26b4d');
    if(caught&&haul>.65)drawRiverFish(g,endX,endY+6,.75);
  }
  for(let i=0;i<2;i++){
    g.beginPath();g.ellipse(x+27+i*18,y+40+i*6,10+Math.sin(clock*2+i)*3,2.5,0,0,Math.PI*2);
    g.strokeStyle='#d9e1c96b';g.lineWidth=.7;g.stroke();
  }
}

function ellipse(g,x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,2*Math.PI);g.fillStyle=fill;g.fill();}
function line(g,x,y,ex,ey,color,width){g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.strokeStyle=color;g.lineWidth=width;g.stroke();}
const tribeColors=['#9c5139','#446c72','#806a96'];
function paintWorker(g,v,x,y,child,walking,sleeping,travel,job,clock,toolkit=[],furWraps=false){
  g.save();g.translate(x,y);
  const variant=Math.imul(v.id,2654435761)>>>0;
  const scale=child ? .60+.004*v.age : .94+(variant%15)/100;
  g.scale(scale,scale);
  const shoulders=child?4:(v.gender==='male'?5:4)+(variant%5-2)*.55;
  const hair=v.age>=240?'#a89d86':['#56402e','#715137','#483a30','#8b653e'][(variant>>>8)%4];
  const hide=furWraps?'#99764f':tribeColors[v.tribe||0];
  if(sleeping){
    ellipse(g,0,-4,12,5,hide);ellipse(g,10,-6,4.6,4,'#c09b51');
    line(g,9,-6,12,-6,'#473723',1);
    g.restore();return;
  }
  const frightened=job==='Flee';
  if(frightened&&!walking)g.scale(1,.68);
  const step=walking?Math.sin(travel*.24)*(frightened?6:4):0,stroke='#382d24';
  line(g,-3,-10,-4-step,0,stroke,3);line(g,3,-10,4+step,0,stroke,3);
  g.fillStyle=hide;g.strokeStyle=stroke;g.lineWidth=1.7;
  g.beginPath();g.moveTo(-shoulders,-26);g.lineTo(shoulders,-25);g.lineTo(8,-9);g.lineTo(1,-11);g.lineTo(-6,-9);g.closePath();g.fill();g.stroke();
  if(furWraps){
    g.fillStyle='#cc9e56';g.beginPath();g.moveTo(-4,-25);g.lineTo(4,-25);g.lineTo(5,-17);g.closePath();g.fill();
    for(let i=-2;i<=2;i++)line(g,i*2,-14,i*2-1,-10+i%2,'#705337',1);
  }else line(g,-3,-23,5,-13,'#dab77c',2);
  ellipse(g,0,-30,5.8,6.1,'#d1a651');g.stroke();ellipse(g,2,-30,1,1,stroke);
  ellipse(g,-.8,-34.2,5.3,2.6,hair);
  if((variant>>>12)%3===0)ellipse(g,-5.4,-32,2.8,3.1,hair);
  else line(g,-4.8,-34,-5.2,-29-(variant%3),hair,2.3);
  if(!child&&v.gender==='male'&&(variant>>>5)%3!==0){
    g.fillStyle=hair;g.beginPath();g.moveTo(-4,-28);g.lineTo(4,-27);g.lineTo(.4,-22.8);g.closePath();g.fill();
  }
  line(g,-1,-36,1,-40,stroke,1.6);ellipse(g,3,-40,3,1.6,'#687547');
  const reach=!walking&&(job==='Forage'||job==='Plant')?Math.sin(clock*4)*3:0;
  if(frightened){
    line(g,-4,-23,-9,-30,stroke,2);line(g,4,-23,8,-32,stroke,2);
  }else{
    line(g,-4,-23,-8,-16+reach,stroke,2);line(g,4,-23,9,-19+reach,stroke,2);
  }
  if((job==='Defend'||job==='Hunt')&&v.gear==='sling'){
    const swing=clock*8+v.id;
    line(g,6,-24,8+8*Math.cos(swing),-27+8*Math.sin(swing),'#c6aa78',1.8);
    ellipse(g,8+8*Math.cos(swing),-27+8*Math.sin(swing),2,2,'#706656');
  }else if(job.startsWith('Craft ')){
    const lift=Math.sin(clock*6)*3;
    line(g,-8,-17,8,-15,'#bb965e',2);ellipse(g,6,-19+lift,3,2,'#a39d88');
  }else if(job==='Chop tree'){
    const swing=walking?0:Math.sin(clock*6);
    const x=14+4*swing,y=-24+9*swing;
    line(g,7,-18,x,y,'#9e7848',2.5);ellipse(g,x,y,4,3,'#a5a18c');
  }else if((v.gear==='digging stick'||toolkit.includes('digging stick'))&&job==='Forage'){
    line(g,7,-22,10,-3,'#b79867',2.5);
  }else if((job==='Hunt'||job==='Defend')&&v.gear==='bow'){
    g.beginPath();g.moveTo(9,-30);g.quadraticCurveTo(23,-18,10,-7);g.strokeStyle='#b99261';g.lineWidth=2;g.stroke();
    line(g,9,-30,10,-7,'#d0bc92',1);
  }else if((job==='Hunt'||job==='Defend')&&v.gear==='spear thrower'){
    line(g,5,-16,15,-21,'#aa8259',3);
    line(g,6,-8,14,-34,'#503926',2);
    g.fillStyle='#c2bca7';g.beginPath();g.moveTo(12,-32);g.lineTo(16,-41);g.lineTo(16,-32);g.closePath();g.fill();g.stroke();
  }
  g.restore();
}

const g=document.getElementById('sheet').getContext('2d'),methods=['spear','trap','line','pole','net'];
let paused=false,clock=2.8,previous=performance.now();
document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Resume animation':'Pause animation';document.getElementById('status').textContent=paused?'Paused':'Live animation';};
function panel(x,y,w,h,method,time,label){
 g.save();g.translate(x,y);g.fillStyle='#f0e4c6';g.fillRect(0,0,w,h);
 g.fillStyle='#496f73';g.beginPath();g.moveTo(0,128);g.quadraticCurveTo(w/2,117,w,134);g.lineTo(w,h);g.lineTo(0,h);g.fill();
 for(let i=0;i<6;i++)line(g,5+i*39,169+i%2*24,27+i*39,169+i%2*24,'#b4c7b94d',1);
 for(let i=0;i<4;i++){line(g,w-25+i*5,130,w-27+i*5,99+i%3*7,'#727e48',1.6);}
 g.font='18px Georgia';g.fillStyle='#382d24';g.fillText(label,12,26);
 g.save();g.translate(45,112);g.scale(1.6,1.6);
 paintWorker(g,{id:2,age:65,gender:'female',tribe:0,traits:[]},0,0,false,false,false,0,'Fish',time,[],false);
 drawRiverFishing(g,{x:0,y:0,method,clock:time,id:0,caught:2});g.restore();g.restore();
}
function frame(now){if(!paused)clock+=(now-previous)/1000;previous=now;g.clearRect(0,0,1200,660);
 const labels=['Wooden fishing spear','Wicker funnel trap','Bone hook + handline','Fixed-line wooden pole','Fibre net + floats/weights'];
 for(let i=0;i<5;i++)panel(i*240,0,234,290,methods[i],clock,labels[i]);
 for(let i=0;i<4;i++)panel(i*300,320,294,300,'net',[1.1,4.3,6,7.6][i],['Net set in the shallows','Watching / soaking','Hauling toward the bank','Lifting out the catch'][i]);
 requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
